aid: skymind
name: Pathmind
description: >-
  Pathmind (formerly Skymind, the company behind the Deeplearning4j open-source deep
  learning library) was a San Francisco reinforcement-learning company that let simulation
  engineers train RL policies against AnyLogic and Python simulations without writing
  machine-learning code. The product had three parts: the Pathmind Helper, an AnyLogic
  palette item that exposed a simulation's observations, actions and reward function to
  Pathmind; a cloud training service where uploaded models became experiments; and
  Pathmind Serving, a FastAPI/Ray policy server that turned a trained policy into a REST
  prediction endpoint. A small first-party REST API (project listing and AnyLogic model
  upload, authenticated with an X-PM-API-TOKEN header) and a first-party Python simulation
  API on PyPI were published. Pathmind ceased operating in November 2021 — its own final
  release, pathmind-webapp v1.8.6, is titled "Final release - disabling sign-ups and
  upgrades" — and the app, API and marketing hosts no longer serve. The artifacts in this
  repository are the surviving public first-party surface, harvested from the company's own
  GitHub organization and PyPI.
