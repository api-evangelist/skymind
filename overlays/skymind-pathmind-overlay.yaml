overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Pathmind API
  version: 1.0.0
extends: openapi/skymind-pathmind-openapi-original.yml
x-generated: '2026-08-05'
x-method: generated
x-source: >-
  Derived from the harvested first-party spec plus live probes on 2026-08-05. The
  original spec is never mutated; every enhancement lives here as an action.
actions:
- target: $.info
  update:
    description: >-
      The Pathmind web application's public REST API. List the authenticated user's
      projects and upload an AnyLogic simulation model to create a Pathmind reinforcement-
      learning experiment. Authenticated with a Pathmind access token in the
      X-PM-API-TOKEN header. NOTE: Pathmind ceased operating in November 2021 and the
      production host api.pathmind.com no longer accepts connections; this definition is
      retained as a historical record of a published first-party contract.
    x-apievangelist-slug: skymind
    x-apievangelist-provider: Pathmind
    x-lifecycle-status: defunct
    x-lifecycle-ceased: '2021-11-17'
- target: $.info
  update:
    x-apievangelist-artifacts:
      authentication: authentication/skymind-authentication.yml
      conventions: conventions/skymind-conventions.yml
      errors: errors/skymind-problem-types.yml
      data_model: data-model/skymind-data-model.yml
      lifecycle: lifecycle/skymind-lifecycle.yml
      changelog: changelog/skymind-changelog.yml
      conformance: conformance/skymind-conformance.yml
      packages: packages/skymind-packages.yml
- target: $.servers[0]
  update:
    x-reachable: false
    x-probed: '2026-08-05'
    x-probe-result: connection refused on 443 (DNS CNAME api.devpathmind.com)
- target: $.tags[?(@.name=='Projects')]
  update:
    description: Read access to the Pathmind projects owned by the authenticated account.
- target: $.tags[?(@.name=='Model Upload')]
  update:
    description: Upload an AnyLogic simulation model to create a Pathmind experiment.
- target: $.paths['/projects'].get
  update:
    description: >-
      Returns every project owned by the account behind the X-PM-API-TOKEN. The response
      is an unbounded array — there is no pagination.
    x-idempotent: true
    x-agentic-access:
      action-class: read
      consequence: read
- target: $.paths['/al/upload'].post
  update:
    description: >-
      Uploads an AnyLogic simulation model as multipart/form-data. Supplying projectId
      attaches the upload to an existing project; omitting it creates a new one. On 201
      the location header points at the web app's editGoals view for the created
      experiment. This operation is NOT idempotent — repeating it creates another
      experiment.
    x-idempotent: false
    x-agentic-access:
      action-class: acting
      consequence: write
- target: $.components.securitySchemes.api_key
  update:
    description: >-
      Pathmind access token, taken from the account page in the Pathmind web app. The
      first-party Python client reads it from the PATHMIND_TOKEN environment variable.
